services:
  api:
    container_name: identity-api
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: dev
        COMMIT: local
        BUILD_DATE: unknown
    env_file:
      - .env
      - .env.compose
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app
      - observability
    restart: unless-stopped

  generate-signing-key:
    build:
      context: .
      dockerfile: Dockerfile
      target: build
    env_file:
      - .env
      - .env.compose
    command: [ "go", "run", "./cmd/generate-signing-key" ]
    networks:
      - app
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    container_name: identity-postgres
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: identity_app
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: identity
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U identity_app -d identity"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - app

  redis:
    container_name: identity-redis
    image: redis:8-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - app

networks:
  app:
    driver: bridge

  observability:
    external: true

volumes:
  pgdata: